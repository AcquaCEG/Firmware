[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino

extra_scripts = pre:load_env.py

build_flags =
    -Iinclude
    ; Injeta as variáveis lidas pelo script Python no código C++
    -D WIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -D WIFI_PASSWORD=\"${sysenv.WIFI_PASSWORD}\"
    -D MQTT_BROKER=\"${sysenv.MQTT_BROKER}\"
    -D MQTT_USERNAME=\"${sysenv.MQTT_USERNAME}\"
    -D MQTT_PASSWORD=\"${sysenv.MQTT_PASSWORD}\"

    ; 2. Dados públicos e fixos do projeto (Pode digitar direto aqui no .ini!)
    -D MQTT_PORT=1883
    -D MQTT_TOPIC=\"acquaceg/devices/${client_id}/sensors/raw\"

lib_deps =
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.11.0
    knolleary/PubSubClient @ ^2.8